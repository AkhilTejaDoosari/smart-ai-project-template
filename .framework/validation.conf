# Validation surface registry.
#
# Format (one record per line, literal | separators):
# name|path|runtime_check|lint|typecheck|test|build
#
# - path is repository-relative.
# - commands run from that path.
# - leave a command field empty when it genuinely does not apply.
# - runtime_check verifies the approved runtime before other checks.
# - at least one of lint/typecheck/test/build must be configured for each surface.
# - commands containing a literal | should live in a project script and be invoked here.
#
# Example:
# backend|backend|python -c 'import sys; assert sys.version_info[:2] == (3,13)'|ruff check .||pytest|
# frontend|frontend|node -e 'const m=process.versions.node.split(".")[0]; if(m!=="22") process.exit(1)'|npm run lint|npm run typecheck|npm test -- --run|npm run build
#
# A fresh template intentionally has no configured surfaces.
